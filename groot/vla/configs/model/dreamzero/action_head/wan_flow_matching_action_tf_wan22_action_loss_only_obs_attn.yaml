# @package _global_
# Action-loss-only + "action attends to current-observation only" ablation of the Wan2.2-TI2V-5B
# action head.
#
# Builds on wan_flow_matching_action_tf_wan22_action_loss_only (ONLY the action flow-matching loss
# is optimized; the video/dynamics loss is logged but contributes no gradient) and ADDITIONALLY
# restricts the action/state register's self-attention so it attends only to:
#   - the clean current observation (the first video frame / conditioning latent), and
#   - its own action+state register,
# and NOT the to-be-generated future video blocks (neither the teacher-forced clean future frames
# at train time nor the self-generated noisy future frames at inference time).
#
# Rationale: with the dynamics loss turned off, the video stream is no longer trained to denoise.
# Keeping action->video attention then creates a train/inference mismatch (at train the action peeks
# at the noised ground-truth future; at inference it would attend to an untrained, self-generated
# rollout). Cutting that edge removes the mismatch while keeping visual conditioning via the first
# frame + CLIP cross-attention + proprio state. CLIP image features are injected through
# cross-attention and are unaffected by this flag.
#
# Select with: model/dreamzero/action_head=wan_flow_matching_action_tf_wan22_action_loss_only_obs_attn

defaults:
  - wan_flow_matching_action_tf_wan22_action_loss_only

action_head_cfg:
  config:
    diffusion_model_cfg:
      action_attend_obs_only: true
